    function generateTouchIconPNG() {
      try {
        const svgEl = document.getElementById('math-dino-svg');
        const linkEl = document.getElementById('apple-touch-icon-link');
        if (!svgEl || !linkEl) return;

        const svgData = new XMLSerializer().serializeToString(svgEl);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 192;
          canvas.height = 192;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#d5e5b5';
          ctx.fillRect(0, 0, 192, 192);
          ctx.drawImage(img, 8, 8, 176, 176);
          linkEl.href = canvas.toDataURL('image/png');
          URL.revokeObjectURL(url);
        };
        img.src = url;
      } catch (_) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
